<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101820" />
      <stop offset="100%" stop-color="#101520" />
    </linearGradient>
  </defs>
  <rect width="560" height="220" fill="url(#ss-bg)" rx="6" />
  <rect x="0.5" y="0.5" width="559" height="219" fill="none" stroke="#167D8D" stroke-width="0.5" stroke-opacity="0.2" rx="6" />
  
  <!-- Building / map grid visual -->
  <g transform="translate(415, 105)" opacity="0.4">
