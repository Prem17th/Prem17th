  <g transform="translate(900, 80)">
    <rect width="270" height="310" rx="6" fill="#101820" stroke="#E8B44D" stroke-width="0.5" stroke-opacity="0.25" />
    <text x="135" y="35" text-anchor="middle" fill="#E8B44D" font-family="Georgia, serif" font-size="13" letter-spacing="3">TOOLS</text>
    <line x1="40" y1="48" x2="230" y2="48" stroke="#E8B44D" stroke-width="0.3" stroke-opacity="0.3" />
    <circle cx="50" cy="80" r="3" fill="#167D8D" />
    <text x="65" y="84" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">Git / GitHub</text>
    <circle cx="50" cy="110" r="3" fill="#167D8D" />
    <text x="65" y="114" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">Linux / CLI</text>
    <circle cx="50" cy="140" r="3" fill="#167D8D" />
    <text x="65" y="144" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">VS Code / Cursor</text>
    <circle cx="50" cy="170" r="3" fill="#167D8D" />
    <text x="65" y="174" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">Alembic / Migrations</text>
    <circle cx="50" cy="200" r="3" fill="#167D8D" />
    <text x="65" y="204" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">pytest</text>
    <circle cx="50" cy="230" r="3" fill="#167D8D" />
    <text x="65" y="234" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">n8n / Automation</text>
  </g>
</svg>
