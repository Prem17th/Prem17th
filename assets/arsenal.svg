    <line x1="40" y1="48" x2="230" y2="48" stroke="#E8B44D" stroke-width="0.3" stroke-opacity="0.3" />
    <circle cx="50" cy="80" r="3" fill="#167D8D" />
    <text x="65" y="84" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">PostgreSQL</text>
    <circle cx="50" cy="110" r="3" fill="#167D8D" />
    <text x="65" y="114" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">MongoDB</text>
    <circle cx="50" cy="140" r="3" fill="#167D8D" />
    <text x="65" y="144" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">SQLite</text>
    <circle cx="50" cy="170" r="3" fill="#167D8D" />
    <text x="65" y="174" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">Supabase / Firebase</text>
    <circle cx="50" cy="200" r="3" fill="#167D8D" />
    <text x="65" y="204" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">Docker</text>
    <circle cx="50" cy="230" r="3" fill="#167D8D" />
    <text x="65" y="234" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="13">AWS Step Functions</text>
  </g>

