<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <defs>
    <linearGradient id="ee-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101820" />
      <stop offset="100%" stop-color="#0D1825" />
    </linearGradient>
  </defs>
  <rect width="560" height="220" fill="url(#ee-bg)" rx="6" />
  <rect x="0.5" y="0.5" width="559" height="219" fill="none" stroke="#167D8D" stroke-width="0.5" stroke-opacity="0.2" rx="6" />
  
  <!-- DAG / brain neural pathway visual -->
  <g transform="translate(420, 110)" opacity="0.45">
    <!-- Nodes in a DAG structure -->
    <circle cx="-40" cy="-50" r="4" fill="#167D8D" />
    <circle cx="20" cy="-50" r="4" fill="#167D8D" />
    <circle cx="-60" cy="-10" r="3.5" fill="#167D8D" />
    <circle cx="-10" cy="-15" r="3.5" fill="#E8B44D" />
    <circle cx="50" cy="-15" r="3.5" fill="#167D8D" />
    <circle cx="-30" cy="25" r="3" fill="#167D8D" />
    <circle cx="30" cy="20" r="3" fill="#167D8D" />
    <circle cx="0" cy="55" r="4" fill="#E8B44D" />
    <!-- DAG edges -->
    <line x1="-40" y1="-50" x2="-60" y2="-10" stroke="#167D8D" stroke-width="0.7" stroke-opacity="0.5" />
    <line x1="-40" y1="-50" x2="-10" y2="-15" stroke="#167D8D" stroke-width="0.7" stroke-opacity="0.5" />
    <line x1="20" y1="-50" x2="-10" y2="-15" stroke="#E8B44D" stroke-width="0.5" stroke-opacity="0.4" />
    <line x1="20" y1="-50" x2="50" y2="-15" stroke="#167D8D" stroke-width="0.7" stroke-opacity="0.5" />
    <line x1="-60" y1="-10" x2="-30" y2="25" stroke="#167D8D" stroke-width="0.7" stroke-opacity="0.5" />
    <line x1="-10" y1="-15" x2="-30" y2="25" stroke="#E8B44D" stroke-width="0.5" stroke-opacity="0.4" />
    <line x1="-10" y1="-15" x2="30" y2="20" stroke="#E8B44D" stroke-width="0.5" stroke-opacity="0.4" />
    <line x1="50" y1="-15" x2="30" y2="20" stroke="#167D8D" stroke-width="0.7" stroke-opacity="0.5" />
    <line x1="-30" y1="25" x2="0" y2="55" stroke="#167D8D" stroke-width="0.7" stroke-opacity="0.5" />
    <line x1="30" y1="20" x2="0" y2="55" stroke="#E8B44D" stroke-width="0.5" stroke-opacity="0.4" />
  </g>

  <text x="35" y="42" fill="#167D8D" font-family="Georgia, serif" font-size="11" letter-spacing="4" opacity="0.5">03</text>
  <text x="35" y="75" fill="#F3E9D2" font-family="Georgia, serif" font-size="24" letter-spacing="1">EPISTEMIC ENGINE</text>
  <line x1="35" y1="85" x2="290" y2="85" stroke="#167D8D" stroke-width="0.5" stroke-opacity="0.3" />
  
  <text x="35" y="110" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="12" opacity="0.8">Multi-document process compiler that builds</text>
  <text x="35" y="128" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="12" opacity="0.8">evidentiary DAGs, detects contradictions, and</text>
  <text x="35" y="146" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="12" opacity="0.8">models deadline risk via Monte Carlo simulation.</text>

  <text x="35" y="180" fill="#167D8D" font-family="Segoe UI, sans-serif" font-size="10" letter-spacing="1">NEXT.JS · TYPESCRIPT · REACT FLOW · BEDROCK</text>
  <text x="35" y="202" fill="#167D8D" font-family="Georgia, serif" font-size="11" opacity="0.4">View Project →</text>
</svg>
