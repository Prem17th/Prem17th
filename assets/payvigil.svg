<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <defs>
    <linearGradient id="pv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101820" />
      <stop offset="100%" stop-color="#120D18" />
    </linearGradient>
  </defs>
  <rect width="560" height="220" fill="url(#pv-bg)" rx="6" />
  <rect x="0.5" y="0.5" width="559" height="219" fill="none" stroke="#D84A43" stroke-width="0.5" stroke-opacity="0.2" rx="6" />
  
  <!-- Shield / sentinel visual -->
  <g transform="translate(430, 105)" opacity="0.45">
    <!-- Shield shape -->
    <path d="M0,-55 L40,-35 L40,10 L0,50 L-40,10 L-40,-35 Z" fill="none" stroke="#D84A43" stroke-width="1" />
    <path d="M0,-40 L28,-25 L28,5 L0,35 L-28,5 L-28,-25 Z" fill="none" stroke="#E8B44D" stroke-width="0.5" stroke-opacity="0.4" />
    <!-- Scanning lines -->
    <line x1="-25" y1="-15" x2="25" y2="-15" stroke="#D84A43" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#D84A43" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="-15" y1="5" x2="15" y2="5" stroke="#D84A43" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="-10" y1="15" x2="10" y2="15" stroke="#D84A43" stroke-width="0.5" stroke-opacity="0.3" />
    <!-- Eye / checkmark -->
    <circle cx="0" cy="-5" r="8" fill="none" stroke="#E8B44D" stroke-width="0.7" />
    <circle cx="0" cy="-5" r="3" fill="#E8B44D" opacity="0.5" />
  </g>

  <text x="35" y="42" fill="#D84A43" font-family="Georgia, serif" font-size="11" letter-spacing="4" opacity="0.5">02</text>
  <text x="35" y="75" fill="#F3E9D2" font-family="Georgia, serif" font-size="28" letter-spacing="2">PAYVIGIL</text>
  <line x1="35" y1="85" x2="210" y2="85" stroke="#D84A43" stroke-width="0.5" stroke-opacity="0.3" />
  
  <text x="35" y="110" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="12" opacity="0.8">AI-assisted payment investigation platform for</text>
  <text x="35" y="128" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="12" opacity="0.8">Indian MSMEs with evidence-based review and</text>
  <text x="35" y="146" fill="#F3E9D2" font-family="Segoe UI, sans-serif" font-size="12" opacity="0.8">immutable approval workflows.</text>

  <text x="35" y="180" fill="#D84A43" font-family="Segoe UI, sans-serif" font-size="10" letter-spacing="1">FASTAPI · REACT · POSTGRESQL · SUPABASE</text>
  <text x="35" y="202" fill="#D84A43" font-family="Georgia, serif" font-size="11" opacity="0.4">View Project →</text>
</svg>
